<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل لوحة التوزيع الكهربائية</title>
<style>
:root{
  --wall:#d9d3c2; --panel:#ece6d3; --panel-edge:#c9c1a9; --ink:#1d2430; --mute:#5b6370;
  --red:#d62828; --yellow:#f2c200; --blue:#1f5fbf;
  --breaker:#e9ebee; --breaker-edge:#9aa1ab; --toggle:#15181d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--wall);color:var(--ink);
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
body{padding:max(14px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:6px 4px 8px;font-weight:700}
.loc{margin:0 4px 12px;font-size:14px;line-height:1.6}
.loc span{display:block;font-size:12px;color:var(--mute)}
.fl{display:block;font-size:12px;color:var(--mute);margin:0 0 10px}
.fl input,.ed input,.ed select,.mfoot input{display:block;width:100%;font:inherit;font-size:14px;color:var(--ink);
  border:1px solid #6b7480;border-radius:6px;padding:7px;background:#fff}
.fl input{margin-top:3px}
.panel{background:var(--panel);border:2px solid var(--panel-edge);border-radius:14px;
  padding:16px 8px 14px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.grid{direction:ltr;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.row{display:flex;align-items:stretch;min-width:0}
.row.right{flex-direction:row-reverse}
.tag{display:flex;align-items:stretch;flex:none}
.right .tag{flex-direction:row-reverse}
.strip{width:9px}
.num{width:26px;background:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;border-top:1px solid #ddd;border-bottom:1px solid #ddd}
.c0{background:var(--red)} .c1{background:var(--yellow)} .c2{background:var(--blue)}
.brk{position:relative;flex:1;min-width:0;min-height:62px;background:linear-gradient(#f4f5f7,var(--breaker));
  border:1px solid var(--breaker-edge);display:flex;align-items:center;gap:8px;padding:6px}
.right .brk{flex-direction:row-reverse}
.sw{flex:none;width:22px;height:34px;background:#cfd3d9;border:1px solid var(--breaker-edge);
  display:flex;align-items:flex-start;justify-content:center;padding-top:3px}
.sw i{display:block;width:14px;height:17px;background:var(--toggle);border-radius:2px}
.name{flex:1;min-width:0;direction:rtl;text-align:center;font-size:13.5px;font-weight:600;
  line-height:1.35;overflow-wrap:anywhere}
.name.empty{color:#8b929c;font-weight:400}
.ed{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ed input{font-weight:600;padding:6px 4px}
.ed select{font-size:12px;padding:4px}
.bd{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  box-shadow:0 0 0 2px var(--panel),0 1px 3px rgba(0,0,0,.3)}
.bd svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd.pos{position:absolute;top:-12px}
.left .bd.pos{right:8px} .right .bd.pos{left:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:14px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .bd{width:20px;height:20px;box-shadow:none}
.legend .bd svg{width:12px;height:12px}
.main{margin:20px auto 0;max-width:380px;background:#fff;border:2px solid var(--breaker-edge);
  border-radius:10px;overflow:hidden}
.bar{display:grid;grid-template-columns:1fr 1fr 1fr;height:10px;direction:ltr}
.mtitle{padding:12px 16px 0;font-weight:700;font-size:15px;text-align:center}
.mgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;padding:16px 16px 0;direction:ltr}
.mside{min-width:0;text-align:center;overflow-wrap:anywhere}
.amp{font-size:20px;font-weight:600;direction:ltr}
.sub{font-size:14px;color:#3b4350;margin-top:4px}
.mtog{width:68px;background:#2a2f36;border-radius:8px;padding:8px 0;display:flex;flex-direction:column;
  align-items:center;gap:6px;color:#fff;font-size:11px;font-weight:700}
.mtog .hd{width:36px;height:60px;background:var(--toggle);border-radius:4px;padding:4px;
  display:flex;flex-direction:column;justify-content:flex-end}
.mtog .hd b{display:block;height:28px;background:var(--red);border-radius:3px}
.mfoot{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding:16px}
.mnote{font-size:14px;overflow-wrap:anywhere}
.mnote span,.mdate{font-size:12px;color:var(--mute)}
.mside .fl,.mfoot .fl{margin:0 0 8px}
.mfoot .fl{width:100%}
.tools{position:sticky;top:0;z-index:5;background:#fff3c4;border:1px solid #d9b100;
  border-radius:10px;padding:10px;margin-bottom:12px;font-size:13px;line-height:1.7}
.tools button{font:inherit;font-weight:700;margin:6px 0 0 6px;padding:9px 14px;border:0;
  border-radius:8px;background:var(--ink);color:#fff;cursor:pointer}
.tools button.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.foot{margin:14px 4px 0;font-size:12px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>دليل مفاتيح لوحة التوزيع</h1>
  <div id="app"></div>
</div>
<script>
// البيانات تُكتب هنا تلقائياً عند حفظ الملف من وضع الإعداد
const DATA = /*N*/{"loc":"شقة سعد","count":14,"updated":"2026-10-09","names":{"1":"غرفة ريان وراكان","2":"الصاله"},"types":{"1":"light","2":"ac","4":"light"},"main":{"amp":"200A","poles":"3P","brand":"الفنار","model":"ALD","note":"عند الحريق أو الصعق افصل المفتاح الرئيسي أولاً"}}/*E*/;

const EDIT = location.hash === '#edit';
const KEY = 'panel-draft-v2';
const TY = {
  light:{n:'إنارة', c:'#e0a000', p:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'},
  ac:{n:'مكيف', c:'#1892b8', p:'<path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5"/>'},
  sock:{n:'مقابس', c:'#6b4fbb', p:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 10v2M15 10v2M9 16h6"/>'},
  heat:{n:'سخان', c:'#e4572e', p:'<path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.5 1 2 1.5 2C10 8 11 5 12 3z"/>'}
};
let D = {loc:'', count:24, names:{}, types:{}, updated:'', main:{amp:'200A', poles:'3P', brand:'', model:'', note:''}};
function merge(s){
  if(!s) return;
  if(typeof s.loc === 'string') D.loc = s.loc;
  if(s.count) D.count = s.count;
  if(s.updated) D.updated = s.updated;
  Object.assign(D.names, s.names || {});
  Object.assign(D.types, s.types || {});
  Object.assign(D.main, s.main || {});
}
merge(DATA);
if(EDIT){ try{ merge(JSON.parse(localStorage.getItem(KEY) || 'null')); }catch(e){} }
const persist = () => { try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = document.getElementById('app');
const icon = (k, cls) => `<span class="bd ${cls || ''}" style="background:${TY[k].c}" title="${TY[k].n}"><svg viewBox="0 0 24 24">${TY[k].p}</svg></span>`;
function fmt(iso){
  try{ return new Date(iso + 'T00:00:00').toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', {year:'numeric', month:'long', day:'numeric'}); }
  catch(e){ return iso; }
}

function breaker(n, side){
  if(n > D.count) return `<div class="row ${side}"></div>`;
  const t = TY[D.types[n]] ? D.types[n] : '', v = D.names[n] || '';
  let body;
  if(EDIT){
    const opts = '<option value="">بدون تصنيف</option>' + Object.keys(TY).map(k => `<option value="${k}"${k === t ? ' selected' : ''}>${TY[k].n}</option>`).join('');
    body = `<div class="ed"><input data-n="${n}" value="${esc(v)}" placeholder="اكتب المكان" maxlength="60"><select data-t="${n}" aria-label="نوع المفتاح ${n}">${opts}</select></div>`;
  }else{
    body = `<div class="name${v ? '' : ' empty'}">${v ? esc(v) : 'غير مسمّى'}</div>`;
  }
  const c = ((n - 1) >> 1) % 3;
  return `<div class="row ${side}"><div class="tag"><div class="strip c${c}"></div><div class="num">${n}</div></div>
    <div class="brk"${t ? ` style="border-top:3px solid ${TY[t].c}"` : ''}>${t ? icon(t, 'pos') : ''}<div class="sw"><i></i></div>${body}</div></div>`;
}

function mainCard(){
  const m = D.main, f = (k, l, p) => `<label class="fl">${l}<input data-m="${k}" value="${esc(m[k] || '')}" placeholder="${p}" maxlength="60"></label>`;
  let left, right, foot;
  if(EDIT){
    left = f('amp', 'الأمبير', '200A') + f('poles', 'الأقطاب', '3P');
    right = f('brand', 'الشركة', 'الفنار') + f('model', 'الموديل', 'ALD225');
    foot = f('note', 'ملاحظات', 'اكتب ملاحظة إن وجدت') + '<div class="mdate">يُسجَّل تاريخ آخر تعديل تلقائياً عند تنزيل الملف</div>';
  }else{
    left = `<div class="amp">${esc(m.amp || '')}</div><div class="sub">${esc(m.poles || '')}</div>`;
    right = `<div dir="auto" style="font-weight:600">${esc(m.brand || '')}</div><div class="sub" dir="auto">${esc(m.model || '')}</div>`;
    foot = (m.note ? `<div class="mnote"><span>ملاحظات:</span> ${esc(m.note)}</div>` : '') +
      (D.updated ? `<div class="mdate">آخر تعديل للدليل: ${fmt(D.updated)}</div>` : '');
  }
  return `<div class="main"><div class="bar"><i class="c0"></i><i class="c1"></i><i class="c2"></i></div>
    <div class="mtitle">المفتاح الرئيسي</div>
    <div class="mgrid"><div class="mside">${left}</div>
      <div class="mtog">ON<div class="hd"><b></b></div>OFF</div><div class="mside">${right}</div></div>
    <div class="mfoot">${foot}</div></div>`;
}

function render(){
  const y = scrollY, rows = Math.ceil(D.count / 2);
  let g = '';
  for(let i = 0; i < rows; i++) g += breaker(2*i+1, 'left') + breaker(2*i+2, 'right');
  const loc = EDIT
    ? `<label class="fl">موقع العداد (المرتبط بالبطاقة أو الباركود)<input data-loc value="${esc(D.loc)}" placeholder="مثال: غرفة الكهرباء، الدور الأرضي" maxlength="100"></label>`
    : (D.loc ? `<p class="loc"><span>موقع العداد</span>${esc(D.loc)}</p>` : '');
  const tools = EDIT ? `<div class="tools">وضع الإعداد: عدد المفاتيح الآن <b>${D.count}</b><br>
    <button id="add">+ إضافة مفتاح</button><button id="del" class="alt">− حذف آخر مفتاح</button>
    <button id="save">تنزيل الملف النهائي</button></div>` : '';
  const used = Object.keys(D.types).some(n => n <= D.count && TY[D.types[n]]);
  const legend = (EDIT || used) ? `<div class="legend">${Object.keys(TY).map(k => `<span>${icon(k)}${TY[k].n}</span>`).join('')}</div>` : '';
  app.innerHTML = tools + loc + `<div class="panel"><div class="grid">${g}</div>${legend}</div>` + mainCard() +
    (EDIT ? '' : '<p class="foot">هذه الصفحة للعرض فقط</p>');
  scrollTo(0, y);
}
render();

if(EDIT){
  app.addEventListener('input', e => {
    const t = e.target;
    if(t.tagName === 'SELECT') return;
    if(t.dataset.n) D.names[t.dataset.n] = t.value;
    else if('loc' in t.dataset) D.loc = t.value;
    else if(t.dataset.m) D.main[t.dataset.m] = t.value;
    persist();
  });
  app.addEventListener('change', e => {
    const t = e.target;
    if(t.dataset.t){ D.types[t.dataset.t] = t.value; persist(); render(); }
  });
  app.addEventListener('click', e => {
    const id = e.target.id;
    if(id === 'add' && D.count < 60){ D.count++; persist(); render(); }
    else if(id === 'del' && D.count > 1){ D.count--; persist(); render(); }
    else if(id === 'save') exportFile();
  });
}

function exportFile(){
  const d = new Date(), p = x => String(x).padStart(2, '0');
  const out = {loc:D.loc.trim(), count:D.count, updated:d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()), names:{}, types:{}, main:{}};
  for(let n = 1; n <= D.count; n++){
    const v = (D.names[n] || '').trim(); if(v) out.names[n] = v;
    if(TY[D.types[n]]) out.types[n] = D.types[n];
  }
  for(const k in D.main) out.main[k] = String(D.main[k]).trim();
  const c = document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML = '';
  const s = c.querySelector('script');
  const json = JSON.stringify(out).replace(/</g, '\\u003c');
  s.textContent = s.textContent.replace(/\/\*N\*\/[\s\S]*?\/\*E\*\//, () => '/*N*/' + json + '/*E*/');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['<!DOCTYPE html>\n' + c.outerHTML], {type:'text/html'}));
  a.download = 'index.html';
  a.click();
}
</script>


</body></html>
